name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    name: Pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pytest-homeassistant-custom-component hard-pins an exact
        # `homeassistant` version per release, so which Python versions it
        # supports moves over time as new releases land (see
        # requirements_test.txt). If a leg here starts failing to resolve
        # dependencies, that's upstream not yet publishing a compatible
        # release for that Python version, not a bug in this repo.
        python-version: ["3.12", "3.14"]
        include:
          # Python 3.14 is marked experimental/non-blocking: as of this
          # writing, pytest-homeassistant-custom-component's Python
          # 3.14-compatible release pulls in a transitive dependency
          # (mashumaro, via a newer Home Assistant) that uses
          # `typing.ByteString`, which Python 3.14 removed - so the test
          # harness itself fails to import, unconditionally, before any of
          # this repo's tests even run. That's an upstream incompatibility,
          # not something fixable here. Once it's resolved upstream, drop
          # this `experimental` flag so the 3.14 leg becomes blocking too.
          - python-version: "3.14"
            experimental: true
    continue-on-error: ${{ matrix.experimental == true }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install test dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements_test.txt

      - name: Run tests with coverage
        run: >
          pytest tests
          --cov=custom_components.transit_app
          --cov-report=term-missing
          --cov-report=xml

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml-py${{ matrix.python-version }}
          path: coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: always()
        with:
          files: coverage.xml
          flags: py${{ matrix.python-version }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  hassfest:
    name: Hassfest validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # "brands" requires a merged home-assistant/brands submission and
          # "topics" requires GitHub repository topics to be set - both are
          # repo-admin/submission steps for HACS *default store* listing,
          # not something a code change here can satisfy, and this repo
          # isn't in the default store (README documents installing it as a
          # HACS custom repository instead).
          ignore: "brands topics"
